[workspace]
members = [
    "crates/bijmantra-core",
    "crates/bijmantra-runtime",
    "crates/bijmantra-server",
    "crates/bijmantra-cli",
]
default-members = [
    "crates/bijmantra-core",
    "crates/bijmantra-runtime",
    "crates/bijmantra-server",
    "crates/bijmantra-cli",
]
resolver = "2"

[workspace.package]
version = "1.0.0-beta.1"
edition = "2024"
authors = ["BijMantra contributors"]
license = "MIT"
repository = "https://github.com/denishdholaria/bijmantraorg"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "process", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v7"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"
