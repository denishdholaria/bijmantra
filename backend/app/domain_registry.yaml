# BijMantra Domain Ownership Registry
#
# Canonical code vocabulary: industry domain names
# Legacy vocabulary: LOKA/Sanskrit aliases
#
# This file replaces the older service-migration registry that grouped files by
# legacy service folders. It is the architecture spine for the modular monolith:
# one deployable backend, internally bounded by domains, with hexagonal
# structure inside each domain.

architecture:
  type: domain_bounded_modular_monolith_with_hexagonal_architecture
  deployment: single_deployable_backend
  code_surface: backend/app/domains
  public_api_surface: backend/app/api/bijmantra
  legacy_vocabulary: LOKA
  code_vocabulary: industry_domain
  migration_rule: wrap_extract_drain
  rewrite_guardrail: no_parallel_backend_reimplementation
  domain_growth_policy: open_registry_not_fixed_taxonomy
  federation_spine: research_asset_core_inside_modular_monolith
  fdca_status: federation_pattern_not_replacement_architecture

domain_creation_criteria:
  - stable ubiquitous language
  - clear data ownership
  - clear capability ownership
  - explicit ports and schemas
  - tenant and policy boundary
  - migration path from transitional surfaces

legacy_domain_aliases:
  sristi: breeding
  bijkosha: germplasm
  bija_kosha: germplasm
  bij_kosha: germplasm
  bija-kosha: germplasm
  bij-kosha: germplasm
  rupa: phenotyping
  kshetra: field_operations
  medha: intelligence
  vani: commercial
  vidya: knowledge

hexagonal_shape:
  canonical_layers:
    - domain
    - application
    - ports
    - schemas
    - adapters
  transitional_layers:
    - contracts
  rule: >
    New domain-owned interfaces go in ports/. New commands, queries, DTOs,
    and event schemas go in schemas/. Existing contracts/ packages are
    compatibility shims while migrated slices drain.

capability_layer:
  status: required_for_large_domain_growth
  rule: >
    domain -> capability -> hexagonal slice. Canonical domains are ownership
    boundaries, not large implementation buckets. Sizeable feature families
    must be organized as named capabilities inside the owning domain before
    broad migration continues.
  target_shape:
    backend: >
      backend/app/domains/<domain>/capabilities/<capability>/
      {domain,application,ports,schemas,adapters}
    frontend: >
      frontend/src/divisions/<division>/capabilities/<capability>/
      {pages,components,hooks,services,state}
  root_layer_rule: >
    Domain root layers stay small and hold shared vocabulary, shared ports, and
    composition only. Feature-specific behavior belongs in capabilities/.
  current_code_roots:
    intelligence.knowledge_graph:
      backend: backend/app/domains/intelligence/capabilities/knowledge_graph
      frontend: null
    knowledge.research_asset_core:
      backend: backend/app/domains/knowledge/capabilities/research_asset_core
      frontend: null
      status: target_extraction
      current_surfaces:
        - backend/app/schemas/fair_metadata.py
        - backend/app/schemas/federated_assets.py
        - backend/app/services/fair_metadata_service.py
        - backend/app/services/federated_asset_registry_service.py
        - backend/app/api/bijmantra/data/fair_metadata.py
        - backend/app/api/bijmantra/data/federated_assets.py

