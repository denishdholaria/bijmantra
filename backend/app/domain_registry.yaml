internal_platform_surfaces:
  developer_master_board:
    path: /admin/developer/master-board
    rule: >
      Internal developer/autonomy coordination only. Product knowledge graph
      and domain inspection surfaces belong to product domains, not this board.

cross_domain_rules:
  allowed:
    - same domain internal imports
    - shared kernel imports through stable infrastructure APIs
    - domain ports
    - service registry protocols
    - event bus/event schemas
    - public API adapters
  forbidden:
    - direct imports of another domain's domain layer
    - direct imports of another domain's application layer
    - direct imports of another domain's adapters
    - new business logic in backend/app/api routes
    - duplicated backend implementations created to mimic a working legacy path
