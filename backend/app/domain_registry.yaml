shared_kernel:
  purpose: >
    Minimal tenant, identity, audit, and BrAPI primitives that are not yet
    safely owned by a single domain. Keep this small and drain domain behavior
    out of shared files when touched.
  current_surfaces:
    - backend/app/models/core.py
    - backend/app/core
    - backend/app/api/auth.py

