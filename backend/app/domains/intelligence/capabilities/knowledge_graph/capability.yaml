id: intelligence_fabric.knowledge_graph
title: Cross-Domain Knowledge Graph
kind: product_capability
status: active
dominion: intelligence_fabric
owner_domain: intelligence
supporting_domains:
  - breeding
  - germplasm
  - phenotyping
  - field_operations
  - commercial
  - knowledge
lifecycle: active
standards:
  - FAIR
  - JSON-LD
  - Schema.org
  - W3C PROV
semantic_spine_adrs:
  - ADR-019
  - ADR-020
  - ADR-021
  - ADR-023
  - ADR-024
frontend_routes:
  - /knowledge-graph
backend_routes:
  - /api/v2/knowledge-graph/*
data_scopes:
  - organization
  - asset
  - evidence
  - provenance
required_permissions:
  - intelligence.knowledge_graph.read
  - intelligence.knowledge_graph.write
suggested_roles:
  - scientist
  - knowledge_curator
  - research_lead
audit_events:
  - knowledge_graph.edge_created
  - knowledge_graph.evidence_retrieved
install_behavior: >
  Enable knowledge graph navigation, API access, retrieval jobs, and
  evidence/audit capture for permitted users.
uninstall_behavior: >
  Hide navigation and reject API access while preserving graph edges,
  evidence packs, and audit history.
tests:
  - tests/domains/intelligence/capabilities/knowledge_graph
  - tests/test_architecture_recovery_guards.py
  - tests/test_platform_dominion_registry.py
source_context:
  - .github/docs/denish-ideas/2026-05-19-future-direction.md
