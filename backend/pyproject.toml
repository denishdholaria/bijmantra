# BijMantra Backend Configuration
# Domain-Bounded Modular Monolith - Import Boundary Enforcement

[project]
name = "bijmantra-backend"
version = "1.0.0-beta.1"
description = "BijMantra Plant Breeding Platform - Backend API"
readme = "README.md"
requires-python = ">=3.13,<4.0"
authors = [
    {name = "BijMantra Team"}
]

# Core dependencies (always installed)
dependencies = [
    # --- Web framework ---
    "fastapi>=0.135.3",
    "uvicorn[standard]>=0.44.0",
    "pydantic[email]>=2.13.0",
    "pydantic-settings>=2.13.1",
    "starlette>=1.0.0",
    # --- Database ---
    "sqlalchemy>=2.0.49",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "geoalchemy2>=0.19.0",
    "greenlet>=3.4.0",
    "aiosqlite>=0.22.1",
    "psycopg2-binary>=2.9.11",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.27",
    "cryptography>=46.0.7",
    "certifi>=2026.2.25",
    # --- HTTP & networking ---
    "httpx>=0.28.1",
    "aiohttp>=3.13.5",
    "websockets>=16.0",
    "redis>=7.4.0",
    "idna>=3.15",
    # --- File & image ---
    "pillow>=12.2.0",
    "aiofiles>=25.1.0",
    "minio>=7.2.20",
    "lxml>=6.0.4",
    # --- Monitoring & infra ---
    "psutil>=7.2.2",
    "sentry-sdk[fastapi]>=2.57.0",
    "gunicorn>=25.3.0",
    # --- Search & messaging ---
    "python-socketio>=5.16.1",
    "meilisearch>=0.40.0",
    "shapely>=2.1.2",
    # --- Templating ---
    "jinja2>=3.1.6",
    "email-validator>=2.3.0",
    # --- Scientific (lightweight) ---
    "numpy>=2.4.4",
    "scipy>=1.17.1",
    "scikit-learn>=1.8.0",
    "pandas>=3.0.2",
    "patsy>=0.5.6",
    # --- Voice ---
    "edge-tts>=7.2.8",
    # --- MCP ---
    "mcp>=1.27.0",
    # --- LangChain & AI ---
    "langchain>=1.2.15",
    "langchain-core>=1.3.3",
    "langchain-google-genai>=4.2.1",
    "langgraph>=1.1.6",
    "langgraph-checkpoint>=4.0.1",
    "langgraph-prebuilt>=1.0.9",
    "langsmith>=0.8.0",
    "google-genai>=1.72.0",
    "huggingface_hub>=1.10.1",
    "pyjwt>=2.12.1",
    "polars>=1.40.0",
    "kaggle>=2.1.2",
    "kagglehub>=1.0.1",
]

# Optional dependency groups (install with: uv sync --extra vision, etc.)
[project.optional-dependencies]
langchain-gpu = [
    # torch/triton — keep optional, install only when GPU work is needed
    "torch>=2.11.0",
]
vision = [
    # NOTE: opencv-python-headless triggers McAfee quarantine on macOS
    # (libaom.dylib, libtiff.dylib flagged as threats). Install only when
    # needed and add venv path to McAfee exclusions first.
    "opencv-python-headless>=4.13.0.92",
]
ml = [
    # Embedding stack — Python 3.13 compatible
    "sentence-transformers>=5.4.0",
    "transformers>=5.2.0",
    "tokenizers>=0.22.2",
    "xgboost>=3.2.0",
    "umap-learn>=0.5.7",
    # NOTE: shap>=0.51.0 and scikit-allel>=1.3.13 are excluded from this group
    # because they pull llvmlite==0.36.0 which only supports Python <3.10.
    # Install them separately if you need SHAP explainability on Python <=3.9.
]
analytics = [
    # Analytical export — pyarrow fails to build on Python 3.15 alpha
    "pyarrow>=23.0.1",
    "polars>=1.39.3",
    "duckdb>=1.5.1",
]
geo = [
    "rasterio>=1.5.0",
    "zarr>=3.1.6",
]
memory = [
    # mem0ai pulls libcst which fails on Python 3.15 alpha (PyO3 version cap)
    "mem0ai>=1.0.10",
    "pgvector>=0.4.2",
]
pdf = [
    "weasyprint>=68.1",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# Only resolve for the environments we actually deploy to.
# mcp>=1.27.0 pulls pywin32 on Windows which has no cp315 wheel — skip Windows resolution.
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]

# =============================================================================
# Tool configurations (unchanged from pip era)
# =============================================================================

[tool.ruff]
# Target Python 3.13+
target-version = "py313"

# Line length matching Black default
line-length = 100

# Exclude common directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.pyc",
    "alembic/versions",
    ".pytest_cache",
]

[tool.ruff.lint]
# Enable these rule sets
# Relaxed rules to pass CI on legacy code while enforcing basics
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "UP",     # pyupgrade
]

# Ignore specific rules
ignore = [
    "E501",   # line too long (handled by formatter)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["app"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Unix-style line endings
line-ending = "lf"

# =============================================================================
# AANAYAN (आनयन) — IMPORT BOUNDARY RULES
# From: Ānayana-maryādā-niyama (आनयन-मर्यादा-नियम)
# =============================================================================
# 
# These rules enforce domain boundaries between canonical bounded contexts.
# BijMantra product language may call these LOKAs, but code uses the
# industry-standard `domains` folder and domain terminology.
# Domains should communicate via ports, service registry, events, or API
# adapters rather than direct imports of another domain's internals.
#
# DOMAINS:
#   - sristi (Creation/Breeding)
#   - bijkosha (Seed Treasury/Germplasm)
#   - rupa (Form/Phenomics)
#   - kshetra (Field/Operations)
#   - medha (Intelligence/Analytics)
#   - vani (Commercial/Business)
#   - vidya (Knowledge/Training)
#
# ALLOWED:
#   - Import from app.core.* (shared infrastructure)
#   - Import from app.models.* only through transitional adapters
#   - Import from event bus/service registry ports for cross-domain communication
#   - Import within the same domain
#
# FORBIDDEN:
#   - Direct import from one domain's internals into another domain
#   - Example: sristi importing from bijkosha adapters or domain internals
#
# =============================================================================

[tool.ruff.lint.per-file-ignores]
# Test files can import anything
"tests/**/*.py" = ["ALL"]

# Migration files have special needs
"alembic/**/*.py" = ["E501", "F401"]

# __init__.py files can have unused imports for re-exports
"**/__init__.py" = ["F401"]

# Main application entry point uses scattered imports for router organization
"app/main.py" = ["E402"]

# =============================================================================
# CANONICAL DOMAINS: import rules are enforced by architecture tests first.
# A future ruff plugin can turn the same map into lint-time restrictions.
# =============================================================================
#
# "app/domains/sristi/**/*.py" = []
# "app/domains/bijkosha/**/*.py" = []
# "app/domains/rupa/**/*.py" = []
# "app/domains/kshetra/**/*.py" = []
# "app/domains/medha/**/*.py" = []
# "app/domains/vani/**/*.py" = []
# "app/domains/vidya/**/*.py" = []
#
# Then use flake8-import-restrictions or custom ruff plugin to enforce:
# - No cross-domain internal imports
# - Cross-domain calls go through ports, service registry, events, or API adapters
# =============================================================================

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests as integration tests (require network access)",
    "postgres_integration: marks integration tests that require a reachable Postgres DSN and are optional in shared CI",
    "performance: marks tests as performance or benchmark checks that are not part of the default correctness suite",
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.deptry]
# Dependency checking configuration
extend_exclude = [
    "alembic",
    "tests",
    ".venv",
    "venv",
]

# Known first-party modules
known_first_party = ["app"]

# Ignore specific dependencies that are used indirectly
ignore_missing = []

# Ignore obsolete dependencies (will be removed)
ignore_obsolete = []

# Ignore transitive dependencies
ignore_transitive = []

# Ignore specific imports for architecture validation
ignore_notebooks = true

[tool.deptry.per_rule_ignores]
# Allow test dependencies
DEP002 = ["pytest", "pytest-asyncio", "pytest-cov", "httpx"]

[dependency-groups]
dev = [
    "hypothesis>=6.152.1",
    "pip-audit>=2.10.0",
]
