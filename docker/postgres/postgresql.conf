# =============================================================================
# PostgreSQL Configuration — BijMantra Development
# =============================================================================
# NOTE: This is a DEVELOPMENT configuration. In production, memory settings
# (shared_buffers, work_mem, effective_cache_size, etc.) must be tuned to the
# server's available RAM. A common rule of thumb: shared_buffers = 25% of RAM.
# =============================================================================

# -----------------------------------------------------------------------------
# EXTENSIONS — loaded at startup via compose.yaml command line:
#   postgres -c shared_preload_libraries=timescaledb,pgaudit
# Do NOT set shared_preload_libraries here — it's passed via -c flag.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# CONNECTIONS
# -----------------------------------------------------------------------------
listen_addresses = '*'
max_connections = 100

# -----------------------------------------------------------------------------
# MEMORY (development sizing — tune for production)
# -----------------------------------------------------------------------------
shared_buffers = 256MB
work_mem = 16MB
maintenance_work_mem = 128MB
effective_cache_size = 1GB

# -----------------------------------------------------------------------------
# TIMESCALEDB
# -----------------------------------------------------------------------------
timescaledb.telemetry_level = off

# -----------------------------------------------------------------------------
# PGAUDIT — session-level and object-level audit logging
# -----------------------------------------------------------------------------
pgaudit.log = 'ddl,role'            # Log all DDL statements and role changes
pgaudit.log_catalog = off           # Suppress catalog queries (reduces noise)
pgaudit.log_client = off            # Do not send audit entries to the client
pgaudit.log_level = log             # Emit audit entries at LOG severity
pgaudit.log_parameter = on          # Include bind parameter values in entries
pgaudit.log_statement_once = on     # Emit statement text once per statement
# pgaudit.role is set by migration 20260423_0300 via ALTER SYSTEM after the
# bijmantra_auditor role is created. Do NOT set it here — the role may not
# exist yet at first startup.

# -----------------------------------------------------------------------------
# LOG ROTATION (Podman-compatible; 7-day / 100 MB cap per file)
# -----------------------------------------------------------------------------
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_file_mode = 0640

# -----------------------------------------------------------------------------
# LOG FORMAT — structured for machine parsing
# -----------------------------------------------------------------------------
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_min_duration_statement = 1000   # Log queries that take longer than 1 s
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
